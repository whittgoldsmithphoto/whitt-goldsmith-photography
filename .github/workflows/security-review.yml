name: Security review
on:
  pull_request:
  push:
    branches:
      [
        audit/server-catalog,
        security/second-audit-hardening,
        ui/consolidated-workspace,
        backend/resource-foundation,
      ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run verify:staging
      - run: npx playwright install --with-deps chromium
      - run: node scripts/catalog-proof-browser-check.mjs
      - run: node scripts/catalog-resource-browser-check.mjs
      - run: node scripts/commerce-customer-browser-check.mjs
      - run: node --experimental-strip-types scripts/catalog-load-baseline.mjs --output catalog-baseline.json
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-baseline
          path: catalog-baseline.json
      - run: npm audit --audit-level=high
